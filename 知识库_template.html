<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>第二大脑 · 知识库</title>
<!-- Markdown renderer (inlined at build time) -->
<script>MARKED_PLACEHOLDER</script>
<!-- HTML sanitizer (inlined at build time) — mitigates stored XSS from note raw HTML -->
<script>PURIFY_PLACEHOLDER</script>
<!-- Graph (inlined at build time) -->
<style>VIS_CSS_PLACEHOLDER</style>
<script>VIS_JS_PLACEHOLDER</script>
<style>
:root {
  --bg: #faf8f5;
  --bg2: #f0ece4;
  --bg3: #e8e3d8;
  --text: #2c2416;
  --text2: #6b5e4a;
  --text3: #9e8e74;
  --accent: #cb6e3e;
  --accent2: #4a7c59;
  --border: #d4c9b5;
  --shadow: 0 1px 6px rgba(44,36,22,0.06);
  --font: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono: "SF Mono","Fira Code",monospace;
  --sidebar-w: 384px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);color:var(--text);background:var(--bg);height:100vh;overflow:hidden;display:flex}

/* ---- Sidebar ---- */
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#sidebar-header{padding:14px 16px;border-bottom:1px solid var(--border)}
#sidebar-header h1{font-size:17px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.sb-head-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-head-btns{display:flex;align-items:center;gap:6px;flex-shrink:0}
#app-ver-btn{font-size:11px;font-weight:700;color:var(--accent2);background:rgba(74,124,89,0.12);border:1px solid var(--border);border-radius:6px;padding:2px 8px;cursor:pointer;font-family:var(--font);white-space:nowrap;line-height:1.6}
#app-ver-btn:hover{border-color:var(--accent2);color:var(--text)}
#sb-title{cursor:pointer;user-select:none;transition:color .15s}
#sb-title:hover{color:var(--accent2)}
#update-hist-btn{font-size:11px;font-weight:600;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 9px;cursor:pointer;font-family:var(--font);white-space:nowrap;line-height:1.5}
#update-hist-btn:hover{border-color:var(--accent);color:var(--accent)}
#update-hist-btn #update-hist-badge{color:#dc2626;font-weight:700}
#search-inp{width:100%;margin-top:10px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--bg);color:var(--text);font-family:var(--font);outline:none}
#search-inp:focus{border-color:var(--accent)}

#tabs{display:flex;border-bottom:1px solid var(--border);font-size:12px}
#tabs button{flex:1;padding:8px;border:none;background:none;cursor:pointer;color:var(--text2);font-family:var(--font);border-bottom:2px solid transparent}
#tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

#file-tree{flex:1;overflow-y:auto;padding:4px 0;font-size:13px}
.tree-folder,.tree-file{padding:4px 12px 4px 8px;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-folder:hover,.tree-file:hover{background:var(--bg3)}
.tree-file.active{background:var(--bg3);font-weight:600;border-left:3px solid var(--accent);padding-left:5px}
.tree-arrow{width:14px;font-size:10px;text-align:center;flex-shrink:0;user-select:none}
.tree-icon{font-size:12px;flex-shrink:0}

/* ---- Main content ---- */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#content-header{padding:10px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text2);overflow:hidden}
#breadcrumb{display:flex;gap:4px}
#breadcrumb span{cursor:default;color:var(--text3)}
#breadcrumb .breadcrumb-link{cursor:pointer;color:var(--accent2);text-decoration:none;border-bottom:1px dashed transparent}
#breadcrumb .breadcrumb-link:hover{color:var(--accent);border-bottom-color:var(--accent)}
#content-area{flex-grow:1;flex-shrink:1;flex-basis:auto;overflow:auto;padding:20px 40px;max-width:1320px;margin:0 auto;overflow-wrap:break-word;word-break:break-word;min-width:0;scrollbar-gutter:stable}

#content-area h1{font-size:22px;margin-bottom:4px;color:var(--accent)}
/* On-page merged per-page button (本页更新 + 历史版本) next to the title */
.page-title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.page-title-row h1{margin-bottom:0}
.page-rec-btn{font-size:12px;font-weight:600;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;font-family:var(--font);white-space:nowrap}
.page-rec-btn:hover{border-color:var(--accent);color:var(--accent)}
#content-area h2{font-size:17px;margin:24px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--bg3)}
#content-area h3{font-size:15px;margin:16px 0 6px}
#content-area p{line-height:1.75;margin:6px 0;font-size:14px}
#content-area blockquote{padding:8px 16px;border-left:3px solid var(--accent2);background:var(--bg2);margin:10px 0;border-radius:0 6px 6px 0;font-size:13px;color:var(--text2)}
#content-area code{background:var(--bg3);padding:1px 5px;border-radius:3px;font-family:var(--mono);font-size:12px;word-break:break-all}
#content-area pre{background:var(--bg2);padding:14px;border-radius:6px;overflow-x:auto;margin:10px 0;border:1px solid var(--border)}
#content-area pre code{background:none;padding:0}
#content-area img{max-width:100%;height:auto;border-radius:6px}
#content-area table{border-collapse:collapse;width:100%;margin:0;font-size:13px}
#content-area th{background:var(--bg3);padding:6px 10px;text-align:left;border:1px solid var(--border);font-weight:600}
#content-area td{padding:5px 10px;border:1px solid var(--border)}
#content-area ul,#content-area ol{padding-left:20px;margin:6px 0}
#content-area li{line-height:1.7;margin:2px 0}
#content-area a.wiki-link{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent);cursor:pointer}
#content-area a.wiki-link:hover{color:#a0401a;border-bottom-style:solid}
#content-area a.ext-link{color:var(--accent2);text-decoration:none;border-bottom:1px dashed var(--accent2);word-break:break-all}
#content-area a.ext-link:hover{color:#2d5a3d;border-bottom-style:solid}
#content-area a.ext-link::after{content:" ↗";font-size:10px;opacity:0.6}
#content-area hr{border:none;border-top:2px solid var(--bg3);margin:20px 0}
#content-area strong{color:var(--text)}
#content-area em{color:var(--text2)}
#empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px;text-align:center;line-height:2;padding:40px;overflow:hidden}
#empty-state b{color:var(--accent)}
/* ---- Diff View ---- */
.diff-banner{margin:0 0 16px;padding:12px 16px;border-radius:10px;background:var(--card-bg);border:1px solid var(--accent);display:flex;align-items:center;gap:12px}
.diff-banner .badge{font-size:11px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;white-space:nowrap}
.diff-banner button{margin-left:auto;padding:6px 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:13px;color:var(--text2);white-space:nowrap}
.diff-banner button:hover{background:var(--card-bg)}
.diff-banner button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.diff-container{font-family:'SF Mono',Menlo,Consolas,monospace;font-size:13px;line-height:1.7;border-radius:8px;overflow:hidden;margin-bottom:20px;border:1px solid var(--border)}
.diff-line{padding:3px 12px;white-space:pre-wrap;word-break:break-all}
.diff-line.add{background:rgba(34,197,94,0.12);color:var(--text)}
.diff-line.add::before{content:'+ ';color:#22c55e;font-weight:700}
.diff-line.del{background:rgba(239,68,68,0.12);color:var(--text);text-decoration:line-through;text-decoration-color:rgba(239,68,68,0.5)}
.diff-line.del::before{content:'- ';color:#ef4444;font-weight:700}
.diff-line.equal{color:var(--text3);background:transparent}
.diff-line.equal::before{content:'  '}
.diff-stats{font-size:12px;color:var(--text3);padding:6px 12px;background:var(--card-bg);border-bottom:1px solid var(--border)}
.diff-note{padding:14px 16px;font-size:13px;color:var(--text2);background:var(--card-bg);border-radius:8px;border:1px solid var(--border)}
/* ---- Inline Diff (高亮+删除线，嵌入原文) ---- */
.inline-diff-add{
  background:#d6f5e3;
  border-left:3px solid #16a34a;
  padding:4px 10px 4px 14px;
  margin:4px 0;
  border-radius:0 4px 4px 0;
  position:relative;
  color:var(--text);
  font-weight:500;
  box-shadow:0 0 0 1px rgba(22,163,74,0.18);
}
.inline-diff-add::before{
  content:"→ ";
  color:#16a34a;
  font-weight:700;
  margin-right:2px;
}
.inline-diff-del{
  background:#fde8e8;
  border-left:3px solid #dc2626;
  padding:4px 10px 4px 14px;
  margin:4px 0;
  border-radius:0 4px 4px 0;
  text-decoration:line-through;
  text-decoration-color:#dc2626;
  text-decoration-thickness:2px;
  color:rgba(120,30,30,0.9);
  position:relative;
  box-shadow:0 0 0 1px rgba(220,38,38,0.18);
}
.inline-diff-del::before{
  content:"→ ";
  color:#dc2626;
  font-weight:700;
  margin-right:2px;
}
.inline-diff-equal{
  padding:2px 8px;
  margin:2px 0;
  opacity:0.55;
}
/* ---- Version History ---- */
.hist-btn{
  padding:6px 14px;border-radius:6px;border:1px solid var(--border);
  background:var(--bg);cursor:pointer;font-size:13px;color:var(--text2);white-space:nowrap;
}
.hist-btn:hover{background:var(--card-bg);color:var(--text)}
.history-item{display:flex;gap:8px;align-items:center;padding:10px 12px;margin:8px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg2)}
.history-item .hist-ver{font-weight:600;min-width:96px}

/* ---- Page version comparison section (per-page update history) ---- */
.page-hist-section{padding:0;margin:10px 16px 4px;border:1px solid var(--accent);border-radius:10px;background:var(--card-bg);overflow:hidden}
.phs-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none}
.phs-title{font-size:13px;font-weight:700;color:var(--accent)}
.phs-arrow{font-size:12px;color:var(--text3);transition:transform .2s ease}
.phs-body{padding:0 16px 12px}
.phs-body.phs-collapsed{display:none}
.phs-header.phs-collapsed .phs-arrow{transform:rotate(-90deg)}
.phs-note{font-size:11px;color:var(--text3);margin-top:3px;line-height:1.5}
.phs-item{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--border)}
.phs-item:first-of-type{border-top:none;padding-top:0}
.phs-ver{font-weight:600;font-size:13px;min-width:120px;color:var(--text)}
.phs-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.phs-btn:hover{background:var(--card-bg);color:var(--text)}
.phs-btn-main{border-color:var(--accent);color:var(--accent)}
.phs-btn-main:hover{background:var(--accent);color:#fff}
.phs-more{margin-top:8px;text-align:right}
.page-hist-empty{padding:10px 16px;margin:10px 16px;font-size:12px;color:var(--text3);background:var(--bg2);border:1px dashed var(--border);border-radius:8px;line-height:1.5}

/* ---- Update History Drawer ---- */
#update-drawer{
  position:absolute;top:0;right:-420px;width:420px;height:100%;
  background:var(--bg);border-left:1px solid var(--border);
  z-index:100;display:flex;flex-direction:column;
  transition:right .3s ease;
  box-shadow:-2px 0 12px rgba(0,0,0,.08);
}
#update-drawer.open{right:0}
#update-drawer-header{
  padding:14px 16px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
  background:var(--bg2);font-size:14px;font-weight:600;
}
#update-drawer-close{
  cursor:pointer;background:none;border:none;font-size:18px;
  color:var(--text2);padding:2px 6px;border-radius:4px;
}
#update-drawer-close:hover{background:var(--bg3)}
#update-drawer-body{flex:1;overflow-y:auto;padding:8px 0}
.update-record{border-bottom:1px solid var(--border)}
.update-record-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer}
.update-record-header:hover{background:var(--bg3)}
.update-record-header.collapsed .update-record-arrow{transform:rotate(-90deg)}
.update-record-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.update-record-meta{font-size:11px;color:var(--text3)}
.update-record-arrow{font-size:11px;color:var(--text3);transition:transform .2s ease;flex-shrink:0;margin-left:8px}
.update-record-body{padding:0 16px 12px;display:none}
.update-record-body.expanded{display:block}
.update-record-affected{font-size:12px;color:var(--text2);line-height:1.6}
.update-record-affected .imp-high{color:#dc2626;font-weight:600}
.update-record-affected .imp-medium{color:#d97706;font-weight:600}
.update-record-affected .imp-low{color:#16a34a;font-weight:600}
.upd-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.upd-back-btn{padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:12px;color:var(--text2)}
.upd-back-btn:hover{background:var(--card-bg);color:var(--text)}
.upd-page-row{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--border)}
.upd-page-row:first-child{border-top:none;padding-top:0}
.upd-page-title{flex:1;font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd-page-btns{display:flex;gap:6px;flex-shrink:0}
.upd-page-btn{padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:var(--bg);cursor:pointer;font-size:12px;color:var(--text2);white-space:nowrap}
.upd-page-block{padding:4px 0}
.upd-page-row{cursor:pointer}
.upd-page-row.expanded{background:var(--bg2)}
.upd-page-chevron{margin-left:8px;color:var(--text3);transition:transform .15s;font-size:12px;flex-shrink:0}
/* Update record summary */
.upd-summary{padding:8px 16px 4px;font-size:12px;line-height:1.6;color:var(--text2);border-bottom:1px dashed var(--border);margin-bottom:6px}
.upd-summary p{margin:0}
.upd-page-row.expanded .upd-page-chevron{transform:rotate(90deg)}
.upd-page-desc{font-size:11px;color:var(--text3);padding:2px 0 2px 20px}
.upd-page-detail{display:none;padding:4px 8px 6px 20px;background:var(--bg2);border-radius:6px;margin:4px 0}
.upd-page-detail.expanded{display:block}
.upd-ver-row{display:flex;align-items:center;gap:8px;padding:4px 0}
.upd-ver-label{font-size:11px;color:var(--text2);flex:1}
.upd-page-nohist{font-size:11px;color:var(--text3);padding:4px 0}
.upd-page-btn:hover{background:var(--card-bg);color:var(--text)}
.upd-page-btn.main{border-color:var(--accent);color:var(--accent)}
.upd-page-btn.main:hover{background:var(--accent);color:#fff}
.upd-page-btn:disabled{opacity:.45;cursor:not-allowed}
.upd-empty{font-size:11px;color:var(--text3);padding:8px 0}
.update-record-detail{
  margin-top:8px;padding:8px 10px;background:var(--bg2);
  border-radius:6px;font-size:12px;color:var(--text2);
  border-left:2px solid var(--accent2);line-height:1.7;
}
.update-record-detail .diff-add{background:#d6f5e3;color:#166534;font-weight:500}
.update-record-detail .diff-del{background:#fde8e8;color:#991b1b;font-weight:500;text-decoration:line-through}
#update-drawer-empty{
  padding:40px 20px;text-align:center;color:var(--text3);font-size:13px;
}

/* Update history button in content-header */
#update-hist-btn{
  cursor:pointer;background:none;border:1px solid var(--border);
  color:var(--text2);font-family:var(--font);font-size:12px;
  padding:4px 10px;border-radius:6px;display:flex;align-items:center;gap:4px;
}
#update-hist-btn:hover{border-color:var(--accent);color:var(--accent)}
#update-hist-badge{
  background:var(--accent);color:#fff;font-size:10px;
  padding:1px 6px;border-radius:10px;font-weight:600;
  min-width:16px;text-align:center;
}
#update-hist-badge:empty{display:none}

/* ---- Inbox drawer (raw/inbox 待处理素材) ---- */
#inbox-btn{margin-left:0;cursor:pointer;background:none;border:1px solid var(--border);color:var(--text2);font-family:var(--font);font-size:12px;padding:4px 10px;border-radius:6px;display:flex;align-items:center;gap:4px}
#inbox-btn:hover{border-color:var(--accent2);color:var(--accent2)}
#inbox-btn .inbox-ico{width:13px;height:13px;color:var(--accent2)}
#inbox-badge{background:var(--accent2);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:600;min-width:16px;text-align:center}
#inbox-badge:empty{display:none}
#inbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:none}
#inbox-overlay.open{display:block}
#inbox-drawer{position:fixed;top:0;right:-440px;width:420px;max-width:92vw;height:100%;background:var(--bg);border-left:1px solid var(--border);box-shadow:-6px 0 24px rgba(0,0,0,.25);z-index:91;display:flex;flex-direction:column;transition:right .3s ease;font-family:var(--font)}
#inbox-drawer.open{right:0}
#inbox-drawer-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);background:var(--bg2);font-weight:700;color:var(--text)}
#inbox-drawer-header .inbox-ico{width:15px;height:15px;color:var(--accent2);vertical-align:-2px;margin-right:6px}
#inbox-drawer-close{cursor:pointer;color:var(--text3);font-size:16px;padding:0 4px}
#inbox-drawer-close:hover{color:var(--accent)}
#inbox-drawer-body{flex:1;overflow-y:auto;padding:10px 12px}
.inbox-empty{padding:48px 20px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
.inbox-group{margin-bottom:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg2)}
.inbox-group-head{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;user-select:none;background:var(--bg3)}
.inbox-group-arrow{transition:transform .2s;color:var(--text3);font-size:11px}
.inbox-group.collapsed .inbox-group-arrow{transform:rotate(-90deg)}
.inbox-group-count{margin-left:auto;font-size:11px;color:var(--text3)}
.inbox-group-body{padding:6px 8px 8px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.inbox-group.collapsed .inbox-group-body{display:none}
.inbox-item{display:block;text-decoration:none;color:inherit;padding:8px 10px;border-radius:8px;margin-bottom:4px;background:var(--bg);border:1px solid var(--border)}
.inbox-item:hover{background:var(--bg3);border-color:var(--accent2)}
.inbox-item-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.inbox-item-title{font-size:13px;font-weight:600;color:var(--text);line-height:1.4}
.inbox-item-date{font-size:11px;color:var(--text3);white-space:nowrap;flex-shrink:0}
.inbox-item-summary{font-size:12px;color:var(--text2);line-height:1.6;margin:4px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inbox-item-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.inbox-open{font-size:11px;color:var(--accent2);font-weight:600}
.inbox-source-badge{font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;line-height:1.6}
.inbox-theme{font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:4px}
.sb-wechat{color:#4a7c59;background:rgba(74,124,89,.14)}
.sb-pdf{color:var(--accent);background:rgba(var(--accent),.14)}
.sb-article{color:#4a7c9c;background:rgba(74,124,156,.14)}
.sb-xiaohongshu{color:#d9487a;background:rgba(217,72,122,.14)}
.sb-zhihu{color:#3a6ea5;background:rgba(58,110,165,.14)}
.sb-tweets{color:#5b7a9e;background:rgba(91,122,158,.14)}
.sb-xiaoetong{color:#7a8c4f;background:rgba(122,140,79,.14)}
.sb-docs{color:#8b6fad;background:rgba(139,111,173,.14)}

/* ---- Hub mark + Home screen ---- */
.hub-mark{color:var(--accent);font-size:10px;margin-right:2px}
.tree-file[data-is-hub]{font-weight:600}
.home{max-width:1200px;margin:0 auto;padding:8px 4px;overflow:hidden}
.home-hero{text-align:center;padding:18px 16px 10px}
.home-hero h1{font-size:26px;color:var(--accent);margin-bottom:8px;letter-spacing:1px}
.home-hero p{color:var(--text2);font-size:14px;line-height:1.8;max-width:720px;margin:0 auto}
.home-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-top:22px;min-width:0}
.home-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px 16px;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.home-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.home-card-title{font-size:16px;font-weight:700;color:var(--text)}
.home-card-desc{font-size:12px;color:var(--text2);margin:6px 0 12px;line-height:1.6}
.home-card-go{font-size:12px;color:var(--accent);font-weight:600}
.home-overview-card-desc{margin:0;overflow:hidden}
.home-card-wide{grid-column:1 / -1}
.home-card-wide .home-overview-card-desc{max-height:360px;overflow-y:auto;padding-right:4px}
.home-overview-horz{display:flex;flex-direction:column;gap:10px}
.home-overview-meta{font-size:11px;color:var(--text3);margin-bottom:2px}
.home-overview-row{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:stretch}
.home-overview-chip{display:inline-flex;flex-direction:column;gap:3px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);cursor:pointer;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;min-width:150px;max-width:320px}
.home-overview-chip:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:var(--shadow)}
.home-overview-chip-rec{font-size:10px;color:var(--text3);line-height:1.2}
.home-overview-chip-main{display:flex;align-items:center;gap:6px}
.home-overview-chip-title{flex:1;font-size:13px;color:var(--text);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-overview-chip:hover .home-overview-chip-title{color:var(--accent)}
.home-overview-chip.ov-hidden{display:none}
.home-overview-row.expanded .home-overview-chip.ov-hidden{display:inline-flex}
.home-overview-toggle{align-self:flex-start;margin-top:2px;font-size:12px;color:var(--accent);background:transparent;border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;transition:border-color .12s ease,background .12s ease}
.home-overview-toggle:hover{border-color:var(--accent);background:var(--bg2)}
.home-overview-empty{font-size:12px;color:var(--text3);padding:8px 0}
/* ---- Update overview on home page ---- */
.uv{display:flex;flex-direction:column;gap:8px}
.ub{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg2)}
.ub-l{border-color:var(--accent);border-width:2px}
.ub-hd{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:8px 12px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:12px}
.ub-tag{font-size:10px;font-weight:700;color:#fff;background:var(--accent);padding:2px 7px;border-radius:4px}
.ub-tit{font-weight:700;color:var(--text);font-size:13px;flex:1;min-width:0}
.ub-d{color:var(--text3);font-size:11px;white-space:nowrap}
.ub-c{color:var(--text3);font-size:11px;margin-left:auto;white-space:nowrap}
.ub-sm{padding:7px 12px;font-size:12px;color:var(--text2);line-height:1.55;border-bottom:1px solid var(--border)}
.ub-pg{display:flex;flex-direction:column}
.ub-it{display:flex;align-items:flex-start;gap:5px;padding:6px 12px;cursor:pointer;border-top:1px dashed var(--border);transition:background .12s}
.ub-it:first-child{border-top:none}
.ub-it:hover{background:var(--bg)}
.ub-il{flex:1;min-width:0}
.ub-ir{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.ub-pt{font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.ub-it:hover .ub-pt{color:var(--accent)}
.ub-id{font-size:11px;color:var(--text2);line-height:1.5;margin-top:2px;padding-left:2px}
.ub-cat{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;white-space:nowrap}
.ub-cat-n{color:#16a34a;background:rgba(22,163,74,0.12)}
.ub-cat-u{color:#2563eb;background:rgba(37,99,235,0.10)}
.ub-cat-v{color:#dc2626;background:rgba(220,38,38,0.10)}
.uv-tog{font-size:12px;color:var(--accent);cursor:pointer;padding:5px 8px;text-align:center;border:1px dashed var(--border);border-radius:8px;transition:background .12s}
.uv-tog:hover{background:var(--bg2)}
.uv-prv{display:flex;flex-direction:column;gap:6px}
/* ---- 1-5 重要度等级徽章（统一替代星星，用于更新抽屉的页面列表） ---- */
.lv-badge{display:inline-block;font-size:10px;font-weight:700;color:#fff;padding:1px 7px;border-radius:4px;flex-shrink:0;line-height:1.6;white-space:nowrap}
.lv-badge.lv5{background:var(--accent)} /* 5 必看 */
.lv-badge.lv4{background:#d98324} /* 4 重要 */
.lv-badge.lv3{background:#7a8c4f} /* 3 有价值 */
.lv-badge.lv2{background:#4a7c9c} /* 2 常规 */
.lv-badge.lv1{background:#8c8c8c} /* 1 次要 */

/* ---- Graph view ---- */
#graph-container{flex:1;position:relative;background:var(--bg);display:none}
#network{width:100%;height:100%}
#graph-container .legend{position:absolute;bottom:12px;left:12px;background:rgba(250,248,245,0.92);padding:8px 12px;border-radius:6px;border:1px solid var(--border);font-size:11px}
#graph-container .legend .row{display:flex;align-items:center;gap:5px;margin:2px 0}
#graph-container .legend .dot{width:9px;height:9px;border-radius:50%}
#graph-detail{position:absolute;top:12px;right:12px;background:rgba(250,248,245,0.94);padding:12px 16px;border-radius:8px;border:1px solid var(--border);max-width:240px;font-size:12px;display:none}
#graph-detail h3{font-size:14px;color:var(--accent);margin-bottom:4px}
#graph-detail .links{max-height:150px;overflow-y:auto}
#graph-detail .link-item{cursor:pointer;color:var(--accent2);padding:2px 0;font-size:11px}
#graph-detail .link-item:hover{text-decoration:underline}

/* ---- Overlay (mobile sidebar backdrop) ---- */
#overlay{display:none;position:fixed;inset:0;background:rgba(44,36,22,0.35);z-index:15}

/* ---- Update tag + Resize handle ---- */
/* ---- Update severity tags ---- */
.update-tag{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;color:#fff;border-radius:9px;padding:1px 7px;vertical-align:middle;line-height:1.5;flex-shrink:0;white-space:nowrap}
.tree-file-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag-new{background:#22c55e}       /* 新增 — 绿色 */
.tag-updated{background:#94a3b8}   /* 小范围更新 — 灰色 */
.tag-major{background:#f59e0b}     /* 重点更新 — 黄色/琥珀色 */
.tag-viewpoint{background:#ef4444} /* 观点改变 — 红色 */
#resize-handle{width:5px;flex-shrink:0;cursor:col-resize;background:transparent;align-self:stretch;transition:background .15s}
#resize-handle:hover,#resize-handle.dragging{background:var(--accent)}
#menu-btn{display:none;position:fixed;top:10px;left:10px;z-index:30;width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--bg);font-size:20px;cursor:pointer;box-shadow:var(--shadow)}

/* Mobile */
@media(max-width:700px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:82%!important;max-width:320px;z-index:20;height:100%;transform:translateX(-100%);transition:transform .22s ease;display:flex;box-shadow:2px 0 12px rgba(44,36,22,0.18)}
  #sidebar.open{transform:translateX(0)}
  #overlay{display:none}
  #main{width:100%;min-width:0}
  #menu-btn{display:block}
  #sidebar.open ~ #menu-btn{display:none}
  #content-area{padding:18px 14px 40px;max-width:none;overflow:auto;overflow-wrap:break-word;word-break:break-word;scrollbar-gutter:stable}
  #content-area table{font-size:12px}
  #content-area th,#content-area td{padding:4px 6px}
  #content-area img{max-width:100%;height:auto;display:block}
  #content-area pre{font-size:12px;padding:10px;max-width:100%}
  #content-area code{font-size:11px;word-break:break-all}
  #content-area p,#content-area li,#content-area blockquote{max-width:100%}
  .diff-banner{flex-wrap:wrap;gap:8px}
  #content-header{padding:10px 14px 10px 56px;font-size:11px}
  #content-area h1{font-size:20px}
  #content-area p,#content-area li{font-size:15px;line-height:1.85}
  .tree-folder,.tree-file{padding:9px 14px 9px 10px;font-size:14px}
  #search-inp{padding:9px 12px;font-size:14px}
  #resize-handle{display:none}
  #update-drawer{width:100%;right:-100%;overflow-x:hidden}
  #update-drawer-body{overflow-wrap:break-word;word-break:break-word}
  #inbox-drawer{width:100%;right:-100%}
  .home-overview-chip{min-width:0;max-width:100%;width:100%}
  .home-card-wide{grid-column:1!important}
  #sysmon{right:8px;bottom:8px;max-width:200px}
  .sysmon-card{min-width:180px}
  .wf-modal-card{width:96vw;max-height:90vh}
  .wf-modal-body{padding:12px 14px;overflow-wrap:break-word;word-break:break-word}
  .page-title-row{flex-wrap:wrap;gap:6px}
  .page-rec-btn{font-size:11px;padding:2px 8px}
  .upd-page-row{flex-wrap:wrap;gap:4px}
  .upd-page-title{white-space:normal;word-break:break-word}
  .upd-toolbar{flex-wrap:wrap}
  .phs-item{flex-wrap:wrap;gap:4px}
  .phs-btn{font-size:11px;padding:2px 6px}
  .ub-hd{font-size:11px;padding:6px 10px}
  .ub-it{padding:5px 10px}
  .ub-pt{white-space:normal;word-break:break-word}
  .home-overview-horz{gap:6px}
  .home-overview-row{gap:4px}
  .home{max-width:100%;padding:4px 2px}
}

/* ---- System Monitor (right rail, bottom-right) ---- */
#sysmon{position:fixed;right:14px;bottom:14px;z-index:80;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:240px}
.sysmon-card{background:rgba(240,236,228,0.94);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;backdrop-filter:blur(4px);opacity:.9;transition:opacity .2s,transform .2s}
.sysmon-card:hover{opacity:1}
.sysmon-head{display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--text2);background:var(--bg3);letter-spacing:.5px;border-bottom:1px solid var(--border)}
.sysmon-head .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 rgba(74,124,89,.6);animation:sysmonPulse 2s infinite}
@keyframes sysmonPulse{0%{box-shadow:0 0 0 0 rgba(74,124,89,.5)}70%{box-shadow:0 0 0 6px rgba(74,124,89,0)}100%{box-shadow:0 0 0 0 rgba(74,124,89,0)}}
.sysmon-body{padding:8px 10px;max-height:46vh;overflow-y:auto}
.sysmon-group{margin-bottom:6px}
.sysmon-group:last-child{margin-bottom:0}
.sysmon-group + .sysmon-group{border-top:1px solid var(--border);padding-top:6px;margin-top:0}
.sysmon-group-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.sysmon-ver-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:11px;line-height:1.55}
.sysmon-ver-name{color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sysmon-ver-meta{font-family:var(--mono);font-size:9.5px;color:var(--text3);white-space:nowrap;text-align:right}
/* collapsed by default: only the toggle pill is visible; card shows on click */
.sysmon-card{display:none;min-width:240px}
.sysmon-card.open{display:block}
.sysmon-toggle{display:flex;align-items:center;gap:6px;padding:5px 12px;font-size:11px;font-weight:700;color:var(--text2);background:rgba(240,236,228,0.94);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);cursor:pointer;backdrop-filter:blur(4px);opacity:.92;transition:opacity .2s,color .2s;user-select:none}
.sysmon-toggle:hover{opacity:1;color:var(--accent)}
.sysmon-toggle .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 0 rgba(74,124,89,.6);animation:sysmonPulse 2s infinite}
.sysmon-toggle .chev{transition:transform .2s;font-size:10px;margin-left:2px}
.sysmon-toggle.collapsed .chev{transform:rotate(-90deg)}
.sysmon-head{cursor:pointer}
.sysmon-ver-row{cursor:pointer;transition:background .12s}
.sysmon-ver-row:hover{background:var(--bg3)}
.sysmon-ver-row:hover .sysmon-ver-name{color:var(--accent)}
.sysmon-ver-row .arrow{color:var(--text3);font-size:10px;margin-left:3px}
/* Workflow modal: in-page markdown viewer */
.wf-modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.wf-modal.open{display:flex}
.wf-modal-backdrop{position:absolute;inset:0;background:rgba(20,18,15,.55);backdrop-filter:blur(2px)}
.wf-modal-card{position:relative;width:min(820px,94vw);max-height:86vh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.35);overflow:hidden;animation:wfPop .18s ease-out}
@keyframes wfPop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.wf-modal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg3);font-weight:700;font-size:14px;color:var(--text)}
.wf-modal-close{margin-left:auto;border:none;background:transparent;font-size:18px;line-height:1;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:6px}
.wf-modal-close:hover{background:var(--bg2);color:var(--accent)}
.wf-modal-body{padding:18px 22px;overflow-y:auto;font-size:14px;line-height:1.7;color:var(--text)}
.wf-modal-body h1,.wf-modal-body h2,.wf-modal-body h3{color:var(--text);margin:1.1em 0 .5em}
.wf-modal-body h1{font-size:1.4em;border-bottom:1px solid var(--border);padding-bottom:.3em}
.wf-modal-body code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:.9em}
.wf-modal-body pre{background:var(--bg3);padding:12px;border-radius:8px;overflow:auto}
.wf-modal-body pre code{background:none;padding:0}
.wf-modal-body blockquote{border-left:3px solid var(--accent2);margin:0;padding:4px 12px;color:var(--text2)}
.wf-modal-body table{border-collapse:collapse;width:100%;font-size:.92em;margin:.6em 0}
.wf-modal-body th,.wf-modal-body td{border:1px solid var(--border);padding:5px 9px;text-align:left}
.wf-modal-body a{color:var(--accent)}
.wf-modal-raw{margin-top:14px;padding-top:10px;border-top:1px dashed var(--border);font-size:12px;color:var(--text3)}
</style>
</head>
<body>

<button id="menu-btn" onclick="toggleSidebar()">☰</button>
<div id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <div class="sb-head-row">
      <h1 id="sb-title" onclick="showHome()" title="回到首页 · 第二大脑">第二大脑</h1>
      <div class="sb-head-btns">
        <button id="app-ver-btn" onclick="toggleAppUpdate()" title="点击查看「应用更新记录」；再次点击返回原页面">vVERSION_PLACEHOLDER</button>
        <button id="update-hist-btn" onclick="toggleUpdateDrawer()" title="查看整个知识库的更新历史">更新历史 <span id="update-hist-badge"></span></button>
        <button id="inbox-btn" onclick="toggleInboxDrawer()" title="查看 Inbox 待处理文章">
          <svg class="inbox-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          Inbox <span id="inbox-badge"></span>
        </button>
      </div>
    </div>
    <input id="search-inp" placeholder="搜索页面..." oninput="doSearch(this.value)">
  </div>
  <div id="tabs">
    <button class="active" onclick="switchTab('files')">文件</button>
    <button onclick="switchTab('graph')">图谱</button>
  </div>
  <div id="file-tree"></div>
</div>

<div id="resize-handle" title="拖动调整侧边栏宽度"></div>

<!-- System Monitor (right rail, collapsed by default) -->
<div id="sysmon">
  <div class="sysmon-card" id="sysmon-card">
    <div class="sysmon-head" onclick="toggleSysMon()" title="点击收起">
      <span class="pulse"></span>系统监控 <span style="margin-left:auto;font-size:10px;color:var(--text3)">▾</span>
    </div>
    <div class="sysmon-body" id="sysmon-body"></div>
  </div>
  <div class="sysmon-toggle collapsed" id="sysmon-toggle" onclick="toggleSysMon()" title="展开/收起系统监控 · 点击版本可看各自工作流">
    <span class="pulse"></span><span id="sysmon-toggle-label">系统监控</span><span class="chev">▾</span>
  </div>
</div>

<!-- Workflow viewer modal (in-page markdown) -->
<div id="wf-modal" class="wf-modal" aria-hidden="true">
  <div class="wf-modal-backdrop" onclick="closeWfModal()"></div>
  <div class="wf-modal-card">
    <div class="wf-modal-head"><span id="wf-modal-title">工作流</span><button class="wf-modal-close" onclick="closeWfModal()" aria-label="关闭">✕</button></div>
    <div id="wf-modal-body" class="wf-modal-body"></div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="content-header">
    <div id="breadcrumb"></div>
    <div id="page-meta" style="color:var(--text3)"></div>
  </div>
  <div id="content-area"><div id="empty-state">正在加载知识库…</div></div>
  <!-- Update History Drawer -->
  <div id="update-drawer">
    <div id="update-drawer-header">
      <span>❓ 更新历史</span>
      <span id="update-drawer-close" onclick="closeUpdateDrawer()">✕</span>
    </div>
<div id="update-drawer-tabs" style="display:flex;border-bottom:1px solid var(--border);font-size:12px;background:var(--bg2)">
      <button id="upd-tab-all" class="upd-tab active" onclick="switchUpdateTab('all')" style="flex:1;padding:8px;border:none;background:none;cursor:pointer;color:var(--text);font-family:var(--font);border-bottom:2px solid var(--accent);font-weight:600">全部</button>
      <button id="upd-tab-strategy" class="upd-tab" onclick="switchUpdateTab('strategy')" style="flex:1;padding:8px;border:none;background:none;cursor:pointer;color:var(--text2);font-family:var(--font);border-bottom:2px solid transparent">策略</button>
    </div>
    <div id="update-drawer-body"></div>
    <div id="update-drawer-footer" style="padding:10px 16px;border-top:1px solid var(--border);background:var(--bg2)">
      <div id="update-tag-status" style="font-size:11px;color:var(--text3);text-align:center;min-height:14px"></div>
    </div>
  </div>

  <!-- Inbox Drawer -->
  <div id="inbox-overlay" onclick="toggleInboxDrawer()"></div>
  <div id="inbox-drawer">
    <div id="inbox-drawer-header">
      <span><svg class="inbox-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Inbox 收录 <span id="inbox-total" style="color:var(--text3);font-weight:600;font-size:12px"></span></span>
      <span id="inbox-drawer-close" onclick="toggleInboxDrawer()">✕</span>
    </div>

function _openPageImpl(slug, hash) {

        onclick += ')';

      }

    });

    // Post-process: add target="_blank" to all external links + style them

    var bc = "";
    for (var i = 0; i < parts.length; i++) {
      if (i > 0) bc += '<span>/</span>';
      if (i < parts.length - 1) {
        // Parent segment → try to find the hub page for this folder
        var parentPath = parts.slice(0, i + 1).join("/");
        var hubCandidate = parentPath + "/" + parts[i];   // e.g. topics/02_投资/02_投资
        var altCandidate = parentPath;                     // e.g. topics/02_投资
        var target = files[hubCandidate] ? hubCandidate : (files[altCandidate] ? altCandidate : null);
        if (target) {
          bc += '<span class="breadcrumb-link" onclick="openPage(\'' + target.replace(/'/g,"\\'") + '\')">' + displayName(parts[i]) + '</span>';
        } else {
          bc += '<span>' + displayName(parts[i]) + '</span>';
        }
      } else {
        bc += '<span>' + displayName(parts[i]) + '</span>';
      }
    }
    document.getElementById("breadcrumb").innerHTML = bc;
    // Show type, links, and update time (to minute)
    var meta = info.type + " · " + info.links.length + " 个链接";
    if (info.mtime) {
      var d = new Date(info.mtime * 1000);
      var yy = d.getFullYear();
      var mm = String(d.getMonth() + 1).padStart(2, "0");
      var dd = String(d.getDate()).padStart(2, "0");
      var hh = String(d.getHours()).padStart(2, "0");
      var mi = String(d.getMinutes()).padStart(2, "0");
      meta += " · 更新 " + yy + "-" + mm + "-" + dd + " " + hh + ":" + mi;
    }
    document.getElementById("page-meta").textContent = meta;
    // Insert merged per-page button next to the page title (本页更新 + 历史版本 in one)
    insertPageRecButton();
    document.getElementById("content-area").scrollTop = 0;

    // Scroll to anchor heading if specified in wikilink (e.g. [[index#更新记录]])
    if (hash) {
      setTimeout(function() {
        var anchorEl = document.getElementById(hash);
        if (!anchorEl) {
          // Search headings by matching text content (for Chinese/Unicode headings)
          var headings = document.querySelectorAll('#content-area h1, #content-area h2, #content-area h3, #content-area h4');
          for (var hi = 0; hi < headings.length; hi++) {
            var hText = headings[hi].textContent.replace(/^[\d.\-]+\s*/, '').trim();
            if (hText === hash) {
              anchorEl = headings[hi];
              break;
            }
            // Also try removing special chars for fuzzy match
            var hPlain = hText.replace(/[^\w\u4e00-\u9fff]/g, '');
            var hashPlain = hash.replace(/[^\w\u4e00-\u9fff]/g, '');
            if (hPlain === hashPlain) {
              anchorEl = headings[hi];
              break;
            }
          }
        }
        if (anchorEl) {
          anchorEl.scrollIntoView({behavior: 'smooth', block: 'start'});
          // Brief highlight flash
          anchorEl.style.transition = 'background 0.6s';
          anchorEl.style.background = 'var(--highlight)';
          setTimeout(function() { anchorEl.style.background = ''; }, 1500);
        }
      }, 100);
    }

    // Highlight tree item by data-slug
    var treeItems = fileTree.querySelectorAll(".tree-file");
    treeItems.forEach(function(el) { el.classList.remove("active"); });
    for (var i = 0; i < treeItems.length; i++) {
      if (treeItems[i].getAttribute("data-slug") === slug) {
        treeItems[i].classList.add("active");
        // Scroll into view
        treeItems[i].scrollIntoView({block:"nearest",behavior:"smooth"});
        break;
      }
    }

    // On mobile, close sidebar
    if (window.innerWidth <= 700) {
      closeSidebar();
    }

    // Clear update tag for this page (user has seen it)
    clearTagForSlug(slug);
  } catch(e) {
    document.getElementById("content-area").innerHTML = '<div style="padding:40px;color:red">⚠️ 渲染错误: ' + e.message + '</div>';
  }
}

function toggleDiffView() {
  var dd = window._currentDiff;
  if (!dd) return;
  var area = document.getElementById("content-area");

  if (window._diffViewOn) {
    area.innerHTML = window._originalHtml;
    window._diffViewOn = false;
  } else {
    var slug = window._currentSlug;
    var info = files[slug];
    var html = '<div class="diff-banner"><span class="badge">更新对比</span><button onclick="toggleDiffView()" class="active">返回正常视图</button></div>';

    if (dd.type === "new") {
      // New pages: render markdown normally, green background
      html += '<div class="diff-note">✨ 本页为今日新增内容</div>';
      var rendered = DOMPurify.sanitize(marked.parse(info.content));
      html += '<div class="diff-container" style="background:rgba(34,197,94,0.06);border-radius:8px;padding:12px 16px">' + rendered + '</div>';

    } else if (dd.type === "updated") {
      // Updated pages: render inline with highlight (add) and strikethrough (del)
      // embedded in the original content flow
      var addC = 0, delC = 0;
      var segs = dd.segments;
      var renderedHtml = '';
      for (var i = 0; i < segs.length; i++) {
        var s = segs[i];
        if (s.type === "add") addC++;
        if (s.type === "del") delC++;
        var renderedLine = DOMPurify.sanitize(marked.parse(s.text));
        if (s.type === "add") {
          renderedHtml += '<div class="inline-diff-add">' + renderedLine + '</div>';
        } else if (s.type === "del") {
          renderedHtml += '<div class="inline-diff-del">' + renderedLine + '</div>';
        } else {
          renderedHtml += renderedLine;
        }
      }

      html += '<div class="diff-stats">对比上一版：+' + addC + ' 行新增 / -' + delC + ' 行删除</div>';
      html += renderedHtml;

    } else if (dd.type === "no_baseline") {
      html += '<div class="diff-note">📄 本页内容已更新，但暂无上一版快照可供对比。</div>';

    } else if (dd.type === "metadata_only") {
      html += '<div class="diff-note">📝 本页仅元数据（如文件名/编号）更新，正文内容无变化。</div>';
    }

    area.innerHTML = html;
    window._diffViewOn = true;
  }
}

// --- Version History (view old versions & diff vs current) ---
function openHistoryPanel() {
  var hist = window._currentHistory || [];
  if (!hist.length) return;
  renderHistoryList();
}
function renderHistoryList() {
  var hist = window._currentHistory || [];
  if (!hist.length) return;
  var area = document.getElementById("content-area");
  var sorted = hist.slice().sort(function(a,b){ return b.version - a.version; }); // newest first
  var html = '<div class="diff-banner"><span class="badge">📜 历史版本</span><button onclick="closeHistoryPanel()" class="active">返回正常视图</button></div>';
  html += '<div class="diff-note">本页保留 ' + hist.length + ' 个历史版本（最多 3 个）。修改文件并重新构建后，旧版本会自动归档到这里。</div>';
  sorted.forEach(function(h, idx) {
    var n = sorted.length - idx;
    var recency = idx === 0 ? "（最新历史）" : "";
    html += '<div class="history-item">';
    html += '<span class="hist-ver">版本 ' + n + '/' + sorted.length + recency + '</span>';
    html += '<button class="hist-btn" onclick="showHistoryVersion(' + h.version + ')">👁 查看内容</button>';
    html += '<button class="hist-btn" onclick="diffHistoryVersion(' + h.version + ')">🔍 对比当前</button>';
    html += '</div>';
  });
  area.innerHTML = html;
  window._historyView = "list";
}
function closeHistoryPanel() {
  var area = document.getElementById("content-area");
  area.innerHTML = window._originalHtml || "";
  window._historyView = null;
  // The saved HTML does not include the injected on-page button, so re-add it
  insertPageRecButton();
}
function showHistoryVersion(v) {
  var hist = window._currentHistory || [];
  var h = null;
  for (var i = 0; i < hist.length; i++) if (hist[i].version === v) { h = hist[i]; break; }
  if (!h) return;
  var area = document.getElementById("content-area");
  var rendered = DOMPurify.sanitize(marked.parse(h.content));
  var html = '<div class="diff-banner"><span class="badge">历史版本 ' + v + '</span><button onclick="backToLatestPage()" class="active">返回最新页面</button></div>';
  html += '<div class="diff-note">⏳ 这是修改前的历史快照（只读）。</div>';
  html += '<div class="diff-container" style="border-radius:8px;padding:12px 16px">' + rendered + '</div>';
  area.innerHTML = html;
  window._historyView = "version";
}
function diffHistoryVersion(v) {
  var hist = window._currentHistory || [];
  var h = null;
  for (var i = 0; i < hist.length; i++) if (hist[i].version === v) { h = hist[i]; break; }
  if (!h) return;
  var segs = h.segments || [];
  var area = document.getElementById("content-area");
  var html = '<div class="diff-banner"><span class="badge">对比当前</span><button onclick="backToLatestPage()" class="active">返回最新页面</button></div>';
  var addC = 0, delC = 0, renderedHtml = '';
  for (var i = 0; i < segs.length; i++) {
    var s = segs[i];
    if (s.type === "add") addC++;
    if (s.type === "del") delC++;
    var rl = DOMPurify.sanitize(marked.parse(s.text));
    if (s.type === "add") renderedHtml += '<div class="inline-diff-add">' + rl + '</div>';
    else if (s.type === "del") renderedHtml += '<div class="inline-diff-del">' + rl + '</div>';
    else renderedHtml += rl;
  }
  html += '<div class="diff-stats">历史版本 → 当前：+' + addC + ' 行 / -' + delC + ' 行</div>';
  html += renderedHtml;
  area.innerHTML = html;
  window._historyView = "diff";
}

// Extract "本次性质一句话" from update record content
function updSummary(rec){
  if(!rec||!rec.content) return "";
  var lines=rec.content.split("\n");
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim().replace(/\*\*/g,"");
    var m=l.match(/本次性质一句话[：:]\s*(.*)/);
    if(m) return m[1].length>200?m[1].substring(0,197)+"…":m[1];
  }
  for(var i=0;i<lines.length&&i<5;i++){
    var l=lines[i].trim().replace(/^>\s*/,"");
    if(l&&l.indexOf("##")!==0&&l.indexOf("---")!==0) return l.length>200?l.substring(0,197)+"…":l;
  }
  return (rec.affected_pages||[]).length+" 个文件更新";
}
// Render one update block
function updBlock(rec,isLatest){
  var n=(rec.slug.match(/第(\d+)次/)||["",""])[1], d=(rec.slug.match(/(\d{4}-\d{2}-\d{2})/)||["",""])[1], t=rec.title||("第"+n+"次更新");
  var h='<div class="'+(isLatest?"ub ub-l":"ub")+'"><div class="ub-hd">'+(isLatest?'<span class="ub-tag">最新</span>':'')+'<span class="ub-tit">'+t+'</span><span class="ub-d">'+d+'</span><span class="ub-c">'+(rec.affected_pages||[]).length+'</span></div>';
  var sm=updSummary(rec);
  if(sm) h+='<div class="ub-sm">'+sm.replace(/</g,'&lt;')+'</div>';
  var pp=(rec.affected_pages||[]).slice().sort(function(a,b){return(b.level||0)-(a.level||0);});
  if(pp.length){h+='<div class="ub-pg">';
    pp.forEach(function(p){
      if(!files[p.slug]) return; var fi=files[p.slug], pt=fi.title||p.slug;
      var catLabel={"new":"新增","updated":"更新","viewpoint":"观点"}[p.category]||"";

      h+='<div class="ub-it" onclick="event.stopPropagation();openPage(\''+p.slug.replace(/'/g,"\\'")+'\')">';
      h+='<div class="ub-il">';
      h+='<div class="ub-ir">'+(catLabel?'<span class="ub-cat '+catCls+'">'+catLabel+'</span>':'')+levelBadge(p.level)+'<span class="ub-pt">'+pt.replace(/</g,'&lt;')+'</span></div>';
      if(p.description) h+='<div class="ub-id">'+p.description.replace(/</g,'&lt;')+'</div>';
      h+='</div></div>';
    });
  h+='</div>';}
  h+='</div>';

function renderLatestUpdateOverview(){
  if(!updateRecords||!updateRecords.length) return "";
  var recs=updateRecords.slice().sort(function(a,b){
    var da=(a.slug.match(/(\d{4}-\d{2}-\d{2})/)||["","0"])[1], db=(b.slug.match(/(\d{4}-\d{2}-\d{2})/)||["","0"])[1];
    var na=parseInt((a.slug.match(/第(\d+)次/)||["",0])[1],10), nb=parseInt((b.slug.match(/第(\d+)次/)||["",0])[1],10);
    return da<db?1:(da>db?-1:(na<nb?1:-1));
  });
  var html='<div class="uv" id="uv">'+updBlock(recs[0],true);
  if(recs.length>1){
    html+='<div class="uv-tog" id="uvTog" onclick="togglePrevUpdates()">📋 展开前 '+(recs.length-1)+' 次 ▾</div><div class="uv-prv" id="uvPrv" style="display:none">';
    for(var i=1;i<recs.length;i++) html+=updBlock(recs[i],false);
    html+='</div>';
  }
  html+='</div>';
  return html;
}

function resolveSlug(name) {
  if (files[name]) return name;
  // Try last segment matching
  var needle = name.split("/").pop();
  for (var slug in files) {
    if (slug.split("/").pop() === needle) return slug;
  }
  return null;
}

// --- Search ---
var lastSearch = "";
function doSearch(q) {
  q = q.toLowerCase().trim();
  if (q === lastSearch) return;
  lastSearch = q;
  if (!q) {
    document.querySelectorAll(".tree-file,.tree-folder").forEach(function(e) { e.style.display = ""; });
    return;
  }
  document.querySelectorAll(".tree-file,.tree-folder").forEach(function(e) { e.style.display = "none"; });
  for (var slug in files) {
    var info = files[slug];
    if (slug.toLowerCase().includes(q) || info.title.toLowerCase().includes(q)) {
      // Show this file
      var items = fileTree.querySelectorAll(".tree-file");
      items.forEach(function(item) {
        if (item.textContent.toLowerCase().includes(q) || 
            (info.title.toLowerCase().includes(q) && item.textContent.includes(info.title))) {
          item.style.display = "";
          // Expand parent folders
          var p = item.parentElement;
          while (p && p !== fileTree) {
            if (p.style.display === "none") p.style.display = "";
            var prev = p.previousElementSibling;
            if (prev && prev.classList.contains("tree-folder")) {
              prev.style.display = "";
              prev.querySelector(".tree-arrow").textContent = "▾";
            }
            p = p.parentElement;
          }
        }
      });
    }
  }
}

// --- Graph ---
var graphInited = false;
function initGraph() {
  if (graphInited) return;
  graphInited = true;

  var typeColors = {topic:"#cb6e3e",entity:"#4a7c59",source:"#9e8e74",insight:"#8b6fad",comparison:"#6b8fad",synthesis:"#ad7b6b",overview:"#5b7a9e",other:"#bbb"};
  var visNodes = new vis.DataSet(graphData.nodes.map(function(n) {
    return {
      id:n.id,label:n.label.length>18?n.label.slice(0,16)+"…":n.label,
      title:n.label,color:{background:typeColors[n.type]||"#bbb",border:"#fff",highlight:{background:typeColors[n.type]||"#bbb",border:"#333"}},
      size:Math.max(6,Math.min(28,6+n.linkCount*1.3)),
      font:{size:10,color:"#2c2416"},
      borderWidth:1,value:n.linkCount
    };
  }));
  var visEdges = new vis.DataSet(graphData.edges.map(function(e) {
    return {from:e.source,to:e.target,color:{color:"rgba(180,170,150,0.3)",highlight:"rgba(203,110,62,0.5)"},width:0.8,smooth:{type:"continuous"}};
  }));
  var network = new vis.Network(document.getElementById("network"),{nodes:visNodes,edges:visEdges},{
    physics:{solver:"forceAtlas2Based",forceAtlas2Based:{gravitationalConstant:-80,centralGravity:0.005,springLength:200,springConstant:0.03},stabilization:{iterations:200}},
    interaction:{hover:true,navigationButtons:false}
  });
  network.on("click",function(p) {
    var detail = document.getElementById("graph-detail");
    if (p.nodes.length > 0) {
      var info = files[p.nodes[0]];
      if (!info) return;
      detail.style.display = "";
      detail.innerHTML = '<h3>' + info.title + '</h3><span style="color:var(--text3)">' + info.type + ' · ' + info.links.length + '链接</span>' +
        '<div style="margin-top:8px"><a class="wiki-link" onclick="openPage(\''+p.nodes[0]+'\');switchTab(\'files\')">打开页面 →</a></div>';
      network.focus(p.nodes[0],{scale:1.3,animation:{duration:400}});
    } else { detail.style.display = "none"; }
  });
}

    body.innerHTML = '<div class="inbox-empty">📭 暂无待处理文章<br><small style="color:var(--text3)">raw/inbox/ 当前为空</small></div>';

  items.forEach(function(it){ (groups[it.source_type] = groups[it.source_type] || []).push(it); });
  var order = Object.keys(groups).sort(function(a,b){ return groups[b].length - groups[a].length; });

  order.forEach(function(st){

    html += '</div>';
    html += '<div class="inbox-group-body">';
    list.forEach(function(it){
      var isHttp = it.url && /^https?:/i.test(it.url);
      var openAttr = isHttp ? ' href="'+inboxEsc(it.url)+'" target="_blank" rel="noopener"' : '';
      html += '<a class="inbox-item"'+openAttr+'>';
      html += '<div class="inbox-item-top"><span class="inbox-item-title">'+inboxEsc(it.title||"(无标题)")+'</span>';
      html += '<span class="inbox-item-date">'+inboxEsc(it.saved_at||"")+'</span></div>';
      if (it.summary) html += '<div class="inbox-item-summary">'+inboxEsc(it.summary)+'</div>';
      html += '<div class="inbox-item-foot">';
      html += '<span class="inbox-source-badge '+cls+'">'+inboxEsc(label)+'</span>';
      if (isHttp) html += '<span class="inbox-open">打开原文 ↗</span>';
      (it.theme||[]).slice(0,4).forEach(function(t){ html += '<span class="inbox-theme">'+inboxEsc(t)+'</span>'; });
      html += '</div></a>';
    });
    html += '</div></div>';
  });
  body.innerHTML = html;
}

function renderPageHistory() {
  var body = document.getElementById("update-drawer-body");
  var pageInfo = getCurrentPageInfo();
  var title = pageInfo ? (pageInfo.title || window._currentSlug) : "本页";
  var info = window._currentSlug ? files[window._currentSlug] : null;
  var hist = (info && info.history) || [];
  hist = hist.slice().sort(function(a, b){ return b.version - a.version; });

  // Find which update records mention this page
  var slug = window._currentSlug;
  var pageUpdates = [];
  if (slug && updateRecords) {
    for (var ri = 0; ri < updateRecords.length; ri++) {
      var rec = updateRecords[ri];
      var pages = rec.affected_pages || [];
      for (var pj = 0; pj < pages.length; pj++) {
        if (pages[pj].slug === slug) {
          pageUpdates.push({ rec: rec, desc: pages[pj].description, cat: pages[pj].category, level: pages[pj].level });
          break;
        }
      }
    }
  }

  var html = '<div style="padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)">';
  html += '<div style="font-size:13px;font-weight:700;color:var(--accent);cursor:pointer" onclick="switchToGlobalHistory()">← 全部更新</div>';
  html += '<div style="font-size:14px;font-weight:700;color:var(--accent)">📋 ' + title + '</div>';
  html += '<div style="font-size:11px;color:var(--text3);margin-top:2px">' + (pageUpdates.length || hist.length) + ' 次修改记录</div>';
  html += '</div>';

  if (pageUpdates.length === 0 && hist.length === 0) {
    html += '<div id="update-drawer-empty">该页面暂无修改记录</div>';
    body.innerHTML = html;
    return;
  }

  // Show update records that affected this page (newest first)
  pageUpdates.sort(function(a,b){
    var da = (a.rec.slug.match(/(\d{4}-\d{2}-\d{2})/)||["","0"])[1];
    var db = (b.rec.slug.match(/(\d{4}-\d{2}-\d{2})/)||["","0"])[1];
    return da < db ? 1 : (da > db ? -1 : 0);
  });

  if (pageUpdates.length > 0) {
    for (var ui = 0; ui < pageUpdates.length; ui++) {
      var pu = pageUpdates[ui];
      var recN = (pu.rec.slug.match(/第(\d+)次/)||["",""])[1];
      var recDate = (pu.rec.slug.match(/(\d{4}-\d{2}-\d{2})/)||["",""])[1];
      var recTitle = "第" + recN + "次更新";
      var catLabel = {"new":"新增","updated":"更新","viewpoint":"观点改变"}[pu.cat] || "";

      html += '<div style="padding:12px 16px;border-bottom:1px solid var(--border)">';
      // Header: level + update number + date + category
      html += '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:4px">';
      html += levelBadge(pu.level);
      html += '<span style="font-size:13px;font-weight:700;color:var(--accent);cursor:pointer" onclick="switchToGlobalHistory()">' + recTitle + '</span>';
      html += '<span style="font-size:11px;color:var(--text3)">' + recDate + '</span>';
      if (catLabel) html += '<span style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--bg3)">' + catLabel + '</span>';
      html += '</div>';
      // Description: what changed for this specific page
      if (pu.desc) html += '<div style="font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:3px">📝 ' + pu.desc.replace(/</g,'&lt;') + '</div>';
      // Snapshot action buttons for the matching history version
      var matchedHist = false;
      for (var hi = 0; hi < hist.length; hi++) {
        if (hist.length - hi === pageUpdates.length - ui) {
          matchedHist = true;
          html += '<div style="display:flex;gap:6px;margin-top:6px">';
          html += '<button class="upd-page-btn" onclick="viewPageHistoryVersion(' + hist[hi].version + ')">查看快照</button>';
          html += '<button class="upd-page-btn main" onclick="diffPageHistoryVersion(' + hist[hi].version + ')">对比当前</button>';
          html += '</div>';
          break;
        }
      }
      html += '</div>';
    }
  } else if (hist.length > 0) {
    // Fallback: show snapshots only if no update records matched
    for (var i = 0; i < hist.length; i++) {
      var h = hist[i];
      var n = hist.length - i;
      html += '<div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">';
      html += '<span class="upd-ver-label">快照 ' + n + '/' + hist.length + (i === 0 ? '（最新）' : '') + '</span>';
      html += '<div style="display:flex;gap:6px">';
      html += '<button class="upd-page-btn" onclick="viewPageHistoryVersion(' + h.version + ')">查看</button>';
      html += '<button class="upd-page-btn main" onclick="diffPageHistoryVersion(' + h.version + ')">对比当前</button>';
      html += '</div></div>';
    }
  }

  body.innerHTML = html;
}

function renderUpdateRecords() {
  var body = document.getElementById("update-drawer-body");
  var pageInfo = getCurrentPageInfo();
  var title, filtered;
  if (updateDrawerMode === "page") {
    filtered = getFilteredRecords();
    title = pageInfo ? (pageInfo.title || window._currentSlug) : "本页";
  } else if (currentUpdateTab === "strategy") {
    filtered = getFilteredStrategyRecords();
    title = "策略相关更新";
  } else {
    filtered = updateRecords;
    title = "知识库全部更新";
  }

  var html = '<div style="padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)">';
  if (updateDrawerMode === "page") {
    html += '<div style="font-size:13px;font-weight:700;color:var(--accent);cursor:pointer" onclick="switchToGlobalHistory()">← 全部更新</div>';
  }
  html += '<div style="font-size:14px;font-weight:700;color:var(--accent)">📋 '+title+'</div>';
  html += '<div style="font-size:11px;color:var(--text3);margin-top:2px">'+filtered.length+' 次更新</div>';
  html += '</div>';

  if (filtered.length === 0) {
    html += '<div id="update-drawer-empty">暂无相关更新记录</div>';
    body.innerHTML = html;
    return;
  }

  // Sort: newest first — by date desc, then by 第N次更新 number desc (same-day tiebreak)
  var sorted = filtered.slice().sort(function(a,b){
    var d = (b.created||"").localeCompare(a.created||"");
    if (d !== 0) return d;
    return getUpdateNum(b) - getUpdateNum(a);
  });
  for (var i = 0; i < sorted.length; i++) {
    var rec = sorted[i];
    var recId = "upd-rec-" + i;
    html += '<div class="update-record" id="' + recId + '">';
    html += '<div class="update-record-header collapsed" onclick="toggleUpdateRecord(\'' + recId + '\', this)">';
    html += '<div>';
    html += '<div class="update-record-title">' + rec.title + '</div>';
    html += '<div class="update-record-meta">' + rec.update_type + '</div>';
    html += '</div>';
    html += '<span class="update-record-arrow">▼</span>';
    html += '</div>';
    html += '<div class="update-record-body collapsed" id="' + recId + '-body">';
    // Show a brief summary of what was updated
    var summary = getUpdateSummary(rec);
    if (summary) {
      html += '<div class="upd-summary">' + DOMPurify.sanitize(marked.parse(summary)) + '</div>';
    }
    html += '<div class="upd-toolbar">';
    html += '<button class="upd-back-btn" onclick="openPage(\'' + rec.slug.replace(/'/g,"\\'") + '\')">📄 查看完整更新记录</button>';
    html += '<button class="upd-back-btn" onclick="applyUpdateTags(\'' + rec.slug.replace(/'/g,"\\'") + '\')">🏷 恢复此更新的标签</button>';
    html += '</div>';
    html += renderAffectedPages(rec);
    html += '</div>';
    html += '</div>';
  }
  body.innerHTML = html;
}

// Extract the update sequence number (第N次更新) from a record's title or slug
function getUpdateNum(rec) {
  if (!rec) return 0;
  var m = ((rec.title || "") + " " + (rec.slug || "")).match(/第\s*(\d+)\s*次/);
  return m ? parseInt(m[1], 10) : 0;
}

// Extract a brief summary from the update record's content
function getUpdateSummary(rec) {
  if (!rec || !rec.content) return "";
  var body = rec.content;
  // Strip frontmatter
  if (body.startsWith("---")) {
    var parts = body.split("---", 3);
    if (parts.length >= 3) body = parts[2];
  }
  // Remove the "# " title line
  body = body.replace(/^# .*\n?/, "");
  // Remove the "## 📌 必看清单" section (everything from it to the next ##)
  body = body.replace(/## 📌 必看清单[\s\S]*?(?=## )/, "");
  // Remove "## 观点变化" section if empty
  body = body.replace(/## 观点变化\n\n\*\*无重大变化。\*\*[\s\S]*?(?=## )/, "");
  body = body.replace(/## 观点变化\n\n无重大变化[\s\S]*?(?=## )/, "");
  // Take the first non-empty paragraph
  var lines = body.split("\n");
  var summary = "";
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (line && !line.startsWith("#") && !line.startsWith(">") && !line.startsWith("---") && !line.startsWith("|")) {
      summary = line;
      break;
    }
  }
  // Truncate long summaries
  if (summary.length > 200) summary = summary.substring(0, 200) + "…";
  return summary || "（本次更新详情见下方受影响页面）";
}

// Map an update-record page category to a severity tag key
function categoryToSev(cat) {
  if (cat === "new") return "new";
  if (cat === "viewpoint") return "viewpoint";
  return "updated";
}

// 1-5 重要度等级（替代星星，统一徽章样式）
var LEVEL_META = {
  5: { label: "必看", cls: "lv5" },
  4: { label: "重要", cls: "lv4" },
  3: { label: "有价值", cls: "lv3" },
  2: { label: "常规", cls: "lv2" },
  1: { label: "次要", cls: "lv1" }
};
function levelBadge(lv) {
  if (!lv) return "";
  var m = LEVEL_META[lv];
  if (!m) return "";
  return '<span class="lv-badge ' + m.cls + '">Lv.' + lv + " " + m.label + "</span>";
}
// 清理描述里的星星与多余分隔符（源 md 里常带 "⭐ | ..."）
function cleanDesc(desc) {
  if (!desc) return "";
  return desc.replace(/⭐/g, "").replace(/^\s*\|+\s*/, "").replace(/\s+/g, " ").trim();
}

// Post-process the "必看清单" section: turn "[N · 标签]" tokens into a styled
// 1-5 score badge (no stars). Handles old "[⭐⭐ | 5]" and new "[5 · 必看]" formats.
function enhanceMustRead() {
  var area = document.getElementById("content-area");
  if (!area) return;
  var lis = area.querySelectorAll("li");
  lis.forEach(function(li){
    var m = li.textContent.match(/^\s*\[[⭐\s|]*?(\d+)\s*(?:[·•\-]\s*([^\[\]()]*?))?\s*\]/);
    if (!m) return;
    var lv = parseInt(m[1], 10);
    var label = (m[2] || "").trim();
    var meta = LEVEL_META[lv];
    if (meta && !label) label = meta.label;
    var cls = meta ? meta.cls : "lv3";
    var badge = '<span class="lv-badge ' + cls + '">' + lv + '分 · ' + (label || "") + '</span> ';
    li.innerHTML = li.innerHTML.replace(/^(\s*)\[[⭐\s|]*?\d+\s*(?:[·•\-]\s*[^\[\]()]*?)?\s*\]/, function(mm, p){ return p + badge; });
  });
}

// Toggle an update-record accordion item in the drawer list
function toggleUpdateRecord(recId, header) {

  if (!body) return;

function renderAffectedPages(rec) {
  var pages = rec.affected_pages || [];
  if (pages.length === 0) return '<div class="upd-empty">本更新未记录具体页面</div>';
  var html = '';
  for (var i = 0; i < pages.length; i++) {
    var p = pages[i];
    var info = files[p.slug];
    if (!info) continue;
    var ptitle = info.title || p.slug;
    var catSev = categoryToSev(p.category);
    // Override to "major" if the file has build-time major severity
    if (info.update_severity === "major") { catSev = "major"; }
    var catLabel = sevLabel[catSev];
    var hist = (info.history || []).slice().sort(function(a,b){ return b.version - a.version; });
    var recent = hist.slice(0, 2);
    var rowId = "aff-pg-" + i;
    html += '<div class="upd-page-block">';
    html += '<div class="upd-page-row" onclick="toggleAffectedPage(\'' + rowId + '\')">';
    html += '<span class="update-tag ' + sevMap[catSev] + '" style="font-size:10px;padding:1px 6px;flex-shrink:0">' + catLabel + '</span>';
    html += levelBadge(p.level);
    html += '<span class="upd-page-title" title="' + ptitle + '">' + ptitle + '</span>';
    html += '<span class="upd-page-chevron">▸</span>';
    html += '</div>';
    var desc = cleanDesc(p.description);
    if (desc) html += '<div class="upd-page-desc">' + desc + '</div>';
    html += '<div class="upd-page-detail collapsed" id="' + rowId + '">';
    if (recent.length) {
      for (var k = 0; k < recent.length; k++) {
        var h = recent[k];
        var n = hist.length - hist.indexOf(h);
        html += '<div class="upd-ver-row">';
        html += '<span class="upd-ver-label">版本 ' + n + '/' + hist.length + (k === 0 ? '（最新历史）' : '') + '</span>';
        html += '<button class="upd-page-btn" onclick="event.stopPropagation();viewAffectedVersion(\'' + p.slug.replace(/'/g,"\\'") + '\',' + h.version + ')">查看</button>';
        html += '<button class="upd-page-btn main" onclick="event.stopPropagation();diffAffectedVersion(\'' + p.slug.replace(/'/g,"\\'") + '\',' + h.version + ')">对比当前</button>';
        html += '</div>';
      }
    } else {
      html += '<div class="upd-page-nohist">该页面暂无历史版本快照（修改并重新构建后自动归档）</div>';
    }
    html += '</div>';
    html += '</div>';
  }
  return html;
}
function toggleAffectedPage(rowId) {
  var row = document.getElementById(rowId);
  if (!row) return;
  var detail = row.nextElementSibling;
  while (detail && !detail.classList.contains("upd-page-detail")) detail = detail.nextElementSibling;
  if (!detail) return;
  var expanded = detail.classList.toggle("expanded");
  row.classList.toggle("expanded", expanded);
}
function viewAffectedVersion(slug, v) {
  window._currentSlug = slug;
  window._currentHistory = (files[slug] && files[slug].history) || [];
  showHistoryVersion(v);
}
function diffAffectedVersion(slug, v) {
  window._currentSlug = slug;
  window._currentHistory = (files[slug] && files[slug].history) || [];
  diffHistoryVersion(v);
}


// Close the update drawer and open a specific page
function closeDrawerThenOpenPage(slug) {
  var drawer = document.getElementById("update-drawer");
  if (drawer) { drawer.classList.remove("open"); updateDrawerOpen = false; }
  openPage(slug);
}




// Return from the update drawer to the latest (current) page, or home if none
function backToLatestPage() {
  var drawer = document.getElementById("update-drawer");
  if (drawer) { drawer.classList.remove("open"); updateDrawerOpen = false; }
  var slug = window._currentSlug;
  if (slug && files[slug]) openPage(slug);
  else showHome();
}

// Apply the severity tags (新增 / 更新 / 观点改变) of a specific update onto the file tree
function applyTagsForRecord(rec) {
  if (!rec) return;
  var pages = rec.affected_pages || [];
  for (var j = 0; j < pages.length; j++) {
    var p = pages[j];
    var sev = categoryToSev(p.category);
    // Check if the file has "major" build-time severity — use "major" tag instead
    var fileInfo = window.files ? window.files[p.slug] : null;
    if (fileInfo && fileInfo.update_severity === "major") {
      sev = "major";
    }
    var items = fileTree ? fileTree.querySelectorAll('.tree-file') : [];
    for (var k = 0; k < items.length; k++) {
      if (items[k].getAttribute('data-slug') === p.slug) {
        if (items[k].querySelector('.update-tag')) break; // keep newest tag for this slug
        items[k].insertAdjacentHTML('beforeend', '<span class="update-tag '+sevMap[sev]+'">'+sevLabel[sev]+'</span>');
        break;
      }
    }
  }
}
function applyUpdateTags(slug) {
  var rec = null;
  for (var i = 0; i < updateRecords.length; i++) {
    if (updateRecords[i].slug === slug) { rec = updateRecords[i]; break; }
  }
  if (!rec) { setUpdateTagStatus("未找到该更新记录"); return; }
  // Clear existing tags first, then apply this record's tags only
  if (fileTree) {
    fileTree.querySelectorAll('.update-tag').forEach(function(el){ el.remove(); });
  }
  applyTagsForRecord(rec);
  // Re-apply read state from localStorage
  try {
    var read = JSON.parse(localStorage.getItem('wiki_read_tags')||'[]');
    read.forEach(function(s){ clearTagForSlug(s); });
  } catch(e){}
  setUpdateTagStatus('已恢复「' + rec.title + '」标签');
}
function autoApplyAllTags() {
  if (!updateRecords || updateRecords.length === 0) return;
  if (!fileTree) return;
  fileTree.querySelectorAll('.update-tag').forEach(function(el){ el.remove(); });
  var sorted = updateRecords.slice().sort(function(a,b){
    var d = (b.created||"").localeCompare(a.created||"");
    if (d !== 0) return d;
    return getUpdateNum(b) - getUpdateNum(a);
  });
  sorted.forEach(function(rec){ applyTagsForRecord(rec); });
  // Re-apply read state from localStorage
  try {
    var read = JSON.parse(localStorage.getItem('wiki_read_tags')||'[]');
    read.forEach(function(s){ clearTagForSlug(s); });
  } catch(e){}
}

// Clear the update tag for a specific slug (called when user opens a page)
function clearTagForSlug(slug) {
  if (!fileTree) return;
  var items = fileTree.querySelectorAll('.tree-file');
  for (var i = 0; i < items.length; i++) {
    if (items[i].getAttribute('data-slug') === slug) {
      var tag = items[i].querySelector('.update-tag');
      if (tag) { tag.remove(); }
      break;
    }
  }
  // Persist to localStorage
  try {
    var read = JSON.parse(localStorage.getItem('wiki_read_tags')||'[]');
    if (read.indexOf(slug) === -1) { read.push(slug); }
    localStorage.setItem('wiki_read_tags', JSON.stringify(read));
  } catch(e){}
}

function setUpdateTagStatus(msg) {
  var el = document.getElementById("update-tag-status");
  if (el) el.textContent = msg;
}

// --- System Monitor (right rail, bottom-right, collapsed by default) ---
function escHtml(s){
  return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}
// Open the workflow source for a version entry — render in-page (no download)
function openWorkflow(cat, key){
  if(typeof SYS_WORKFLOW_CONTENT === 'undefined') return;
  var c = (cat === 'page') ? SYS_WORKFLOW_CONTENT.page : (SYS_WORKFLOW_CONTENT[cat] ? SYS_WORKFLOW_CONTENT[cat][key] : null);
  if(!c) return;
  var label = (cat === 'page') ? '应用更新记录' : key;
  var rawLink = (typeof SYS_WORKFLOW_LINKS !== 'undefined') ? ((cat === 'page') ? SYS_WORKFLOW_LINKS.page : (SYS_WORKFLOW_LINKS[cat] ? SYS_WORKFLOW_LINKS[cat][key] : null)) : null;
  var html = DOMPurify.sanitize(marked.parse(c), { ADD_ATTR: ['target'] });
  document.getElementById('wf-modal-title').textContent = label + (cat === 'page' ? '（应用更新记录）' : '（工作流）');
  var body = document.getElementById('wf-modal-body');
  body.innerHTML = html;
  if(rawLink){
    body.insertAdjacentHTML('beforeend', '<p class="wf-modal-raw"><a href="' + escHtml(rawLink) + '" target="_blank" rel="noopener">查看原始文件 ↗</a></p>');
  }
  var modal = document.getElementById('wf-modal');
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
}
function closeWfModal(){
  var modal = document.getElementById('wf-modal');
  if(!modal) return;
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
  document.getElementById('wf-modal-body').innerHTML = '';
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape'){ closeWfModal(); closeUvModal(); } });
// Toggle the collapsed/expanded state of the monitor card
function toggleSysMon(){
  var card = document.getElementById('sysmon-card');
  var toggle = document.getElementById('sysmon-toggle');
  if(!card) return;
  var open = card.classList.toggle('open');
  if(toggle) toggle.classList.toggle('collapsed', !open);
}
function renderSysMon(){
  var body = document.getElementById('sysmon-body');
  if(!body) return;
  var data = (typeof SYS_VERSIONS !== 'undefined' && SYS_VERSIONS) ? SYS_VERSIONS : {page:'?',schema:{},skills:{}};
  var links = (typeof SYS_WORKFLOW_LINKS !== 'undefined' && SYS_WORKFLOW_LINKS) ? SYS_WORKFLOW_LINKS : null;
  var upd = (typeof SYS_UPDATES !== 'undefined' && SYS_UPDATES) ? SYS_UPDATES : null;
  function clickable(cat, key){
    if(!links) return false;
    return (cat === 'page') ? !!links.page : !!(links[cat] && links[cat][key]);
  }
  function metaHtml(cat, key){
    var ver = (cat === 'page') ? (data.page || '') : ((data[cat] && data[cat][key]) ? 'v' + data[cat][key] : '');
    var when = '';
    if(upd){
      var u = (cat === 'page') ? upd.page : (upd[cat] ? upd[cat][key] : null);
      if(u) when = u.rel || u.date;
    }
    var parts = [];
    if(when) parts.push('📝 ' + escHtml(when));
    if(ver) parts.push(escHtml(String(ver)));
    return parts.join(' · ');
  }
  function rowsHtml(cat, obj){
    return Object.keys(obj).map(function(k){
      var c = clickable(cat, k);
      var click = c ? ' onclick="openWorkflow(\'' + cat + '\',\'' + k + '\')" title="点击查看 ' + escHtml(k) + ' 工作流"' : '';
      var arrow = c ? '<span class="arrow">↗</span>' : '';
      return '<div class="sysmon-ver-row"' + click + '><span class="sysmon-ver-name">' + escHtml(k) + arrow + '</span><span class="sysmon-ver-meta">' + metaHtml(cat, k) + '</span></div>';
    }).join('');
  }
  function groupHtml(title, cat, obj){
    if(!obj || !Object.keys(obj).length) return '';
    return '<div class="sysmon-group"><div class="sysmon-group-title">' + title + '</div>' + rowsHtml(cat, obj) + '</div>';
  }
  var html = '';
  html += '<div class="sysmon-group"><div class="sysmon-group-title">页面</div><div class="sysmon-ver-row" onclick="openWorkflow(\'page\',\'\')" title="点击查看页面更新工作流"><span class="sysmon-ver-name">页面<span class="arrow">↗</span></span><span class="sysmon-ver-meta">' + metaHtml('page','') + '</span></div></div>';
  html += groupHtml('Schema', 'schema', data.schema);
  html += groupHtml('Skills', 'skills', data.skills);
  body.innerHTML = html;
  // collapsed toggle shows the page version at a glance
  var lbl = document.getElementById('sysmon-toggle-label');
  if(lbl) lbl.textContent = '系统监控 v' + (data.page || '?');
}
renderSysMon();
</script>
